name: sigap

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: sigap
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  db-init:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["npm", "run", "db:init"]
    restart: "no"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      DB_NAME: sigap
    depends_on:
      mysql:
        condition: service_healthy

  ai:
    build:
      context: ./server/ai-waste
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      KERAS_BACKEND: tensorflow
    volumes:
      - model-cache:/root/.cache/huggingface
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 5m

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: sigap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      AI_WASTE_URL: http://ai:8000/api/v1/identify
      AI_WASTE_TIMEOUT_MS: 300000
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - uploaded-files:/app/uploads
    depends_on:
      db-init:
        condition: service_completed_successfully
      ai:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploaded-files:
  model-cache:
