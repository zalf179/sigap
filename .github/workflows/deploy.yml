name: deploy

on:
  push:
    branches: [main]

concurrency: deploy-prod

permissions:
  contents: read
  packages: write
  id-token: write

env:
  RG: sigap-rg
  NSG: sigap-nsg

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: sigap-server
            context: ./server
          - image: sigap-ai
            context: ./server/ai-waste
          - image: sigap-client
            context: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/zalf179/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SSH for this runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az network nsg rule create -g $RG --nsg-name $NSG -n gha-ssh \
            --priority 105 --direction Inbound --access Allow --protocol Tcp \
            --destination-port-ranges 22 --source-address-prefixes $IP
          sleep 25

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          TARGET=${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          scp docker-compose.prod.yml $TARGET:/opt/sigap/docker-compose.prod.yml
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh $TARGET "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh $TARGET "
            cd /opt/sigap &&
            export IMAGE_TAG=${{ github.sha }} &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans &&
            curl --fail --retry 30 --retry-delay 10 --retry-connrefused http://127.0.0.1:5000/api/health
          "

      - name: Close SSH rule
        if: always()
        run: |
          az network nsg rule delete -g $RG --nsg-name $NSG -n gha-ssh || true
