name: deploy

on:
  push:
    branches: [main]

concurrency: deploy-prod

permissions:
  contents: read

env:
  RG: sigap-rg
  NSG: sigap-nsg

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sigap-server
            context: ./server
          - image: sigap-ai
            context: ./server/ai-waste
          - image: sigap-client
            context: ./client
    env:
      TAG: ghcr.io/zalf179/${{ matrix.image }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build dulu ke lokal (belum push) supaya bisa di-scan
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # lolos scan baru di-push (cache bikin langkah ini cepat)
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}

  deploy:
    needs: [codeql, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SSH for this runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az network nsg rule create -g $RG --nsg-name $NSG -n gha-ssh \
            --priority 105 --direction Inbound --access Allow --protocol Tcp \
            --destination-port-ranges 22 --source-address-prefixes $IP
          sleep 25

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          TARGET=${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}
          scp docker-compose.prod.yml $TARGET:/opt/sigap/docker-compose.prod.yml
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh $TARGET "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh $TARGET "
            cd /opt/sigap &&
            export IMAGE_TAG=${{ github.sha }} &&
            docker compose -f docker-compose.prod.yml pull &&
            docker compose -f docker-compose.prod.yml up -d --remove-orphans &&
            curl --fail --retry 30 --retry-delay 10 --retry-connrefused http://127.0.0.1:5000/api/health
          "

      - name: Close SSH rule
        if: always()
        run: |
          az network nsg rule delete -g $RG --nsg-name $NSG -n gha-ssh || true
